{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NutriPlan{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{% url 'planner:home' %}">NutriPlan</a>
        <nav class="nav">
            <a href="{% url 'recipes:list' %}">Рецепты</a>
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}">Профиль</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Вход</a>
                <a href="{% url 'accounts:signup' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>Учебный проект. Приложение не заменяет консультацию врача.</p>
    </footer>
</body>
</html>
