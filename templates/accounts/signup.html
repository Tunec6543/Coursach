{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Регистрация</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Зарегистрироваться</button>
    </form>
    <p class="auth-alt">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
</section>
{% endblock %}
