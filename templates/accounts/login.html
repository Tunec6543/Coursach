{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Вход</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Войти</button>
    </form>
    <p class="auth-alt">Нет аккаунта? <a href="{% url 'accounts:signup' %}">Регистрация</a></p>
</section>
{% endblock %}
